name: Sync fork with upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'alkank/voltius'
    runs-on: ubuntu-latest

    steps:
      - name: Check sync credentials
        env:
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::Add the UPSTREAM_SYNC_TOKEN repository secret with Contents and Workflows write access to alkank/voltius."
            exit 1
          fi

      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Merge upstream changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/VoltiusApp/voltius.git
          git fetch upstream main
          git merge --no-edit upstream/main
          git push origin main
